<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Electricity Bill Splitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>⚡ Electricity Bill Splitter</h1>

  <label>Total Electricity Bill (₹)</label>
  <input type="number" id="totalBill" placeholder="Enter total bill">

  <h2>Shops / Flats</h2>

  <div id="shops">

    <div class="shop">
      <input type="text" placeholder="Shop Name" class="name">
      <input type="number" placeholder="Previous Reading" class="prev">
      <input type="number" placeholder="Current Reading" class="curr">
    </div>

    <div class="shop">
      <input type="text" placeholder="Shop Name" class="name">
      <input type="number" placeholder="Previous Reading" class="prev">
      <input type="number" placeholder="Current Reading" class="curr">
    </div>

  </div>

  <button onclick="addShop()">+ Add Shop</button>
  <button onclick="calculate()">Calculate</button>
  <button onclick="resetForm()">Reset</button>

  <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
